<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Radius</title>
  </head>
  <body>
    <div>
      <style>
        /*border-radius = borda arredondada do elemento em que estiver utilizando a regra*/
        div {
          width: 400px;
          height: 400px;
          background-color: #00ffee;

          border-top-left-radius: 40px;
          border-top-right-radius: 10px;
          border-bottom-right-radius: 40px;
          border-bottom-left-radius: 10px;
        }

        /*border-radius: 40px 10px 40px 10px = o primeiro valor é para o lado de cima e do lado esquerdo, o segundo valor é para o lado de cima e do lado direito, o terceiro valor é para o lado de baixo e do lado direito e o quarto valor é para o lado de baixo e do lado esquerdo

        border-top-left-radius = borda arredondada do lado de cima e do lado esquerdo do elemento em que estiver utilizando a regra

        border-top-right-radius = borda arredondada do lado de cima e do lado direito do elemento 
        
        border-bottom-right-radius = borda arredondada do lado de baixo e do lado direito do elemento

        border-bottom-left-radius = borda arredondada do lado de baixo e do lado esquerdo do elemento */
      </style>
    </div>
  </body>
</html>
